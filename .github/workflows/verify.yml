name: verify
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UW_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: workspace/app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: workspace/app/package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: PDF and OCR programs (D-037)
        run: sudo apt-get update -q && sudo apt-get install -y -q poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: bash scripts/verify.sh
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: workspace/app/sbom.cdx.json
